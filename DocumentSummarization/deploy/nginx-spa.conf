# Nginx SPA 回退示例（若改用 History 模式时启用）
# 将 root 换成实际 dist 目录后 include 或粘贴到 server 块

server {
    listen 80;
    server_name _;

    root /opt/your-app/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # 若前后端同域反代 API：
    # location /api/ {
    #     proxy_pass http://127.0.0.1:8000;
    # }
}
